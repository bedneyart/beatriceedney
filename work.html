<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work — Bea Edney</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a class='logo' href='/'>Bea Edney</a>
            <ul class="nav-links">
                <li><a href='/work'>Work</a></li>
                <li><a href='/statement'>Statement</a></li>
                <li><a href='/bio'>Bio</a></li>
                <li><a href='/cv'>CV</a></li>
                <li><a href='/press'>Press</a></li>
                <li><a href='/contact'>Contact</a></li>
            </ul>
        </div>
    </nav>

    <main>
        <section class="work-section">
            <h2>Current Work</h2>
            <!-- The gallery is built automatically from artworks.js -->
            <div class="gallery" id="gallery"></div>
            <noscript><p>Please enable JavaScript to see the gallery.</p></noscript>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Bea Edney</p>
    </footer>

    <script src="artworks.js"></script>
    <script>
        (function () {
            var gallery = document.getElementById("gallery");
            var html = "";

            ARTWORKS.forEach(function (a) {
                var meta = [a.year, a.technique, a.size].filter(Boolean).join(" | ");
                var inner =
                    '<img src="' + escapeHTML(a.image) + '" alt="' + escapeHTML(altText(a)) + '" loading="lazy">' +
                    '<div class="image-details">' +
                        '<p class="title">' + escapeHTML(a.title) + '</p>' +
                        '<p class="metadata">' + escapeHTML(meta) + '</p>' +
                        (a.sold ? '<p class="sold-label"><span class="sold-dot" aria-hidden="true"></span>Sold</p>' : '') +
                    '</div>';

                if (a.sold) {
                    html += '<div class="gallery-item is-sold">' + inner + '</div>';
                } else {
                    html += '<a class="gallery-item gallery-link" href="piece.html?id=' +
                            encodeURIComponent(a.id) + '">' + inner + '</a>';
                }
            });

            gallery.innerHTML = html;
        })();
    </script>
</body>
</html>
